function redeem(){const v=$('cd').value,m=$('cm');if(v!=='HUNOR'){m.textContent='Érvénytelen kód.';return}if(CU){m.textContent='Ezt a kódot már beváltottad.';return}CU=1;try{localStorage.setItem('ad_code','1')}catch(e){}TC+=10000;sv();m.textContent='Siker! +10 000 coin jóváírva.'}
function pause(){state='pause';show(`<h1 style="font-size:52px">Szünet</h1><button onclick="cont()">Folytatás</button><button onclick="menu()">Főmenü</button>`)}
function cont(){hide();state='play'}
function dt3(i){const r=RES[i],w=WD[i],c=r?MC[r.m]:'#6b5a3c';
 show(`<h2>Eredmények</h2><div id="map" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#3b2a14"><img src="${TH[i]}" style="width:min(19vh,135px);height:min(19vh,135px);border-radius:50%;object-fit:cover;border:6px solid ${c};box-shadow:0 5px 14px rgba(0,0,0,.45)${r?'':';filter:grayscale(.8) brightness(.8)'}"><div style="font-size:22px;font-weight:700">${w.n}</div>${r?`<div style="font-size:36px;line-height:1">${ME[r.m]}</div><div style="font-size:22px;font-weight:800">${MN[r.m]}</div><div style="font-size:17px">Legjobb idő: <b>${fmt(r.t)}</b></div><div style="font-size:17px">Halálok: <b>${r.d}</b></div><div style="font-size:17px">Coin: <b>${r.c||0}/${r.n??'?'}</b></div>`:'<div style="font-size:17px">Még nem teljesítetted.</div>'}<button onclick="res(1)" style="position:absolute;right:14px;bottom:14px;min-width:0;padding:8px 22px;font-size:16px">Vissza</button></div>`,1)}
function dt2(i){const r=RES[i],w=WD[i],c=r?MC[r.m]:'#6b5a3c';
 show(`<h2>Eredmények</h2><div id="map" style="height:auto;width:min(520px,94vw);padding:28px 10px;display:flex;flex-direction:column;align-items:center;gap:10px;color:#3b2a14"><img src="${TH[i]}" style="width:min(48vw,230px);height:min(48vw,230px);border-radius:50%;object-fit:cover;border:8px solid ${c};box-shadow:0 5px 14px rgba(0,0,0,.45)${r?'':';filter:grayscale(.8) brightness(.8)'}"><div style="font-size:26px;font-weight:700">${w.n}</div>${r?`<div style="font-size:60px;line-height:1">${ME[r.m]}</div><div style="font-size:28px;font-weight:800">${MN[r.m]}</div><div style="font-size:20px">Legjobb idő: <b>${fmt(r.t)}</b></div><div style="font-size:20px">Halálok: <b>${r.d}</b></div>`:'<div style="font-size:20px">Még nem teljesítetted.</div>'}</div><button onclick="res(1)">Vissza</button>`,1)}
function menu(){state='menu';mmus();show(`<h1>AirDash</h1><button onclick="newGame()">Játék</button><button onclick="res()">Eredmények</button><button onclick="shop()">Bolt</button><button onclick="opts()">Beállítások</button><p class="s">A/D mozgás · Space ugrás · Shift dash · W/S mászás · E elenged · E+A/D elrugaszkodás · Esc: szünet</p>`,2)}
function opts(){show(`<h2>Beállítások</h2><label>Zene <input id="vm" type="range" min="0" max="1" step=".05" value="${vol.m}"></label><label>Effektek <input id="vs" type="range" min="0" max="1" step=".05" value="${vol.s}"></label><label><input id="tt" type="checkbox" ${tut?'checked':''}> Tanító pálya</label><div style="display:flex;gap:8px;align-items:center"><input id="cd" type="text" placeholder="Kód" autocomplete="off" onkeydown="if(event.key=='Enter')redeem()" style="padding:10px;font-size:16px;border-radius:8px;border:2px solid var(--ac);background:#16202e;color:var(--fg);width:150px"><button style="min-width:0;padding:10px 18px;font-size:16px" onclick="redeem()">Beváltás</button></div><p id="cm" class="s"></p><button onclick="menu()">Vissza</button>`,1);
 $('vm').oninput=e=>{vol.m=+e.target.value;av()};$('tt').onchange=e=>{tut=e.target.checked;try{localStorage.setItem('ad_tut',tut?1:0)}catch(x){}};$('vs').oninput=e=>{vol.s=+e.target.value;av();ia();sfx('jump')}}
function newGame(){deaths=0;start(tut?0:1)}
function start(i){ia();if(A.state=='suspended')A.resume();load(i);hide();state='play';playM(i)}
let last=0,acc=0;
function loop(t){requestAnimationFrame(loop);const dt=Math.min((t-last)/1000,.05);last=t;if(state=='play'){acc+=dt;while(acc>=1/120){step(1/120);acc-=1/120;if(state!='play')break}}draw()}
load(0);menu();requestAnimationFrame(loop);
</script></body></html>
