function hlv(){state='menu';mmus();let h=`<h2>Halloweeni pályák</h2><p class="s" style="font-size:18px">${star} Sötét coin: <b>${DC}</b></p><div id="shop" style="grid-template-columns:repeat(3,minmax(0,1fr))">`;
 for(let i=7;i<10;i++){const r=RES[i];h+=`<div class="sk hl" onclick="start(${i})"><img class="lv" src="${thumb(i)}"><b>${WD[i].n}</b><span class="mdl">${r?ME[r.m]+' '+MN[r.m]:'–'}</span><small>${r?`Idő: ${fmt(r.t)} · Halálok: ${r.d}<br>Sötét coin: ${r.c||0}/${r.n||5}`:'Még nem teljesítetted<br>Sötét coin: 0/5'}</small></div>`}
 show(h+`</div><p class="s">Kattints egy pályára az indításhoz.</p><button onclick="evt()">Vissza</button>`,1)}
function hshop(m){state='menu';mmus();if([7,8,9].every(k=>RES[k]&&RES[k].m==2)&&!OWN.includes(14)){OWN.push(14);sv()}
 let h=`<h2>Halloweeni bolt</h2><p class="s" style="font-size:18px">${star} Sötét coin: <b>${DC}</b> · 50 sötét coin / kinézet</p><div id="shop">`;
 [11,12,13,14].forEach(k=>{const o=OWN.includes(k),s=SKN==k,u=k==14;h+=`<div class="sk${s?' on':''}${u?' ul':''}"><img src="${simg(k)}"><b>${SK[k]}</b><small>${u?'Dupla ugrás!':''}</small><button onclick="hbuy(${k})"${o||u?' disabled':''}>${o?(u?'Feloldva':'Megvásárolva'):u?'Arany a 3 pályán':'Vásárlás · 50 ★'}</button></div>`});
 show(h+`</div><p class="s">${m||''}</p><button onclick="evt()">Vissza</button>`,1)}
function hbuy(k){if(OWN.includes(k))return;else if(k!=14&&DC>=50){DC-=50;OWN.push(k)}else return hshop('Nincs elég sötét coinod.');sv();hshop('Megvásárolva! A Karakterek menüben tudod kiválasztani.')}
function chars(){state='menu';mmus();if([7,8,9].every(k=>RES[k]&&RES[k].m==2)&&!OWN.includes(14)){OWN.push(14);sv()}
 let h=`<h2>Karakterek</h2><p class="s" style="font-size:18px">Válaszd ki, melyik kinézettel szeretnél játszani.</p><div id="shop">`;
 [...OWN].sort((a,b)=>a-b).forEach(k=>{if(!SK[k])return;const s=SKN==k;h+=`<div class="sk${s?' on':''}${k==14?' ul':''}"><img src="${simg(k)}"><b>${SK[k]}</b><button onclick="pick(${k})"${s?' disabled':''}>${s?'Kiválasztva':'Kiválasztás'}</button></div>`});
 show(h+`</div><button onclick="menu()">Vissza</button>`,1)}
function pick(k){SKN=k;sv();chars()}
const unl=()=>[0,1,2,3,4,5,6].every(k=>RES[k]&&RES[k].m==2);
const LB={};
async function lbInit(){try{if(typeof claude=='undefined')return;const db=await claude.use('db'),us=await claude.use('user');if(!db||!us)return;LB.db=db;LB.uid=await us.id();const w=us.can?await us.can('data.write'):true;LB.canW=w!==false&&!!LB.uid}catch(e){}}
function stats(){let g=0,s=0,b=0;for(const k in RES){const m=RES[k].m;if(m==2)g++;else if(m==1)s++;else b++}const ch=OWN.length;return{ch,g,s,b,pt:Math.floor(PT),sc:ch*50+g*100+s*60+b*30+Math.floor(PT/300)}}
async function lbReg(){const L=LB;if(!L.db||!L.canW||L.n||L.busy)return;L.busy=1;try{const me=L.db.doc('players/'+L.uid),s=await me.get();if(s.exists)L.n=+s.data().n||0;else for(let t=0;t<6&&!L.n&&!L.full;t++){const r=await L.db.doc('meta/reg').acquire({holder:L.uid,ttlMs:4000});if(r.acquired){const q=await L.db.collection('players').get();if(q.size>=200){L.full=1;break}let mx=0;q.docs.forEach(d=>{mx=Math.max(mx,+d.data().n||0)});const st=stats();await me.set({n:mx+1,ch:st.ch,g:st.g,s:st.s,b:st.b,pt:st.pt,sc:st.sc});L.n=mx+1;L.last=JSON.stringify(st);L.t=Date.now()}else await new Promise(r=>setTimeout(r,800+Math.random()*700))}}catch(e){}L.busy=0}
async function lbSync(f){const L=LB;if(!L.db||!L.n||L.sy||(!f&&Date.now()-(L.t||0)<60000))return;const st=stats(),k=JSON.stringify(st);if(k==L.last)return;L.sy=1;try{await L.db.doc('players/'+L.uid).set({n:L.n,ch:st.ch,g:st.g,s:st.s,b:st.b,pt:st.pt,sc:st.sc});L.last=k;L.t=Date.now()}catch(e){}L.sy=0}
const tf=s=>Math.floor(s/3600)+' ó '+Math.floor(s%3600/60)+' p';
async function lb(){state='menu';mmus();const back='<button onclick="evt()">Vissza</button>',hd='<h2>Világranglista</h2>';show(hd+'<p class="s">Betöltés...</p>'+back,1);const L=LB;
 if(!L.db){show(hd+'<p class="s" style="font-size:18px">A ranglista most nem érhető el. Jelentkezz be a claude.ai-ba, és nyisd meg újra az oldalt.</p>'+back,1);return}
 await lbReg();await lbSync(1);
 try{const q=await L.db.collection('players').orderBy('sc','desc').limit(200).get(),rows=q.docs.map(d=>({id:d.id,...d.data()})),pos=rows.findIndex(r=>r.id==L.uid);
  const info=pos>=0?`Neved: <b>Player ${+rows[pos].n}</b> · Helyezésed: <b>${pos+1}.</b> (${rows.length} játékos)`:L.full?'A ranglista betelt (200 játékos), ezért nem kerültél fel.':!L.canW?'Csak megtekintő módban vagy, ezért nem szerepelsz a ranglistán.':'Még nem szerepelsz a ranglistán.';
  let t='<div id="lbt"><table><tr><th>#</th><th>Játékos</th><th>Karakter</th><th>Arany</th><th>Ezüst</th><th>Bronz</th><th>Játékidő</th><th>Pont</th></tr>';
  rows.forEach((r,i)=>{t+=`<tr class="${r.id==L.uid?'me':''}"><td>${i+1}.</td><td>Player ${+r.n}</td><td>${+r.ch||0}</td><td>${+r.g||0}</td><td>${+r.s||0}</td><td>${+r.b||0}</td><td>${tf(+r.pt||0)}</td><td>${+r.sc||0}</td></tr>`});
  show(hd+`<p class="s" style="font-size:18px">${info}</p>`+t+'</table></div>'+back,1)}catch(e){show(hd+'<p class="s">Nem sikerült betölteni a ranglistát.</p>'+back,1)}}
function pause(){state='pause';show(`<h1 style="font-size:52px">Szünet</h1><button onclick="cont()">Folytatás</button><button onclick="menu()">Főmenü</button>`)}
function cont(){hide();state='play'}
function dt3(i){const r=RES[i],w=WD[i],c=r?MC[r.m]:'#6b5a3c';
 show(`<h2>Eredmények</h2><div id="map" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:#3b2a14"><img src="${TH[i]}" style="width:min(19vh,135px);height:min(19vh,135px);border-radius:50%;object-fit:cover;border:6px solid ${c};box-shadow:0 5px 14px rgba(0,0,0,.45)${r?'':';filter:grayscale(.8) brightness(.8)'}"><div style="font-size:22px;font-weight:700">${w.n}</div>${r?`<div style="font-size:36px;line-height:1">${ME[r.m]}</div><div style="font-size:22px;font-weight:800">${MN[r.m]}</div><div style="font-size:17px">Legjobb idő: <b>${fmt(r.t)}</b></div><div style="font-size:17px">Halálok: <b>${r.d}</b></div><div style="font-size:17px">Coin: <b>${r.c||0}/${r.n??'?'}</b></div>`:'<div style="font-size:17px">Még nem teljesítetted.</div>'}<button onclick="res(1)" style="position:absolute;right:14px;bottom:14px;min-width:0;padding:8px 22px;font-size:16px">Vissza</button></div>`,1)}
function dt2(i){const r=RES[i],w=WD[i],c=r?MC[r.m]:'#6b5a3c';
 show(`<h2>Eredmények</h2><div id="map" style="height:auto;width:min(520px,94vw);padding:28px 10px;display:flex;flex-direction:column;align-items:center;gap:10px;color:#3b2a14"><img src="${TH[i]}" style="width:min(48vw,230px);height:min(48vw,230px);border-radius:50%;object-fit:cover;border:8px solid ${c};box-shadow:0 5px 14px rgba(0,0,0,.45)${r?'':';filter:grayscale(.8) brightness(.8)'}"><div style="font-size:26px;font-weight:700">${w.n}</div>${r?`<div style="font-size:60px;line-height:1">${ME[r.m]}</div><div style="font-size:28px;font-weight:800">${MN[r.m]}</div><div style="font-size:20px">Legjobb idő: <b>${fmt(r.t)}</b></div><div style="font-size:20px">Halálok: <b>${r.d}</b></div>`:'<div style="font-size:20px">Még nem teljesítetted.</div>'}</div><button onclick="res(1)">Vissza</button>`,1)}
function menu(){state='menu';mmus();lbSync();show(`<h1>AirDash</h1><div class="mrow"><div class="col"><button onclick="newGame()">Játék</button><button onclick="res()">Eredmények</button><button onclick="chars()">Karakterek</button></div><div class="col"><button onclick="shop()">Bolt</button><button onclick="evt()">Halloween</button><button onclick="opts()">Beállítások</button></div></div><p class="s">A/D mozgás · Space ugrás · Shift dash · W/S mászás · E elenged · E+A/D elrugaszkodás · Esc: szünet</p>`,2)}
function opts(){show(`<h2>Beállítások</h2><label>Zene <input id="vm" type="range" min="0" max="1" step=".05" value="${vol.m}"></label><label>Effektek <input id="vs" type="range" min="0" max="1" step=".05" value="${vol.s}"></label><label><input id="tt" type="checkbox" ${tut?'checked':''}> Tanító pálya</label><div style="display:flex;gap:8px;align-items:center"><input id="cd" type="text" placeholder="Kód" autocomplete="off" onkeydown="if(event.key=='Enter')redeem()" style="padding:10px;font-size:16px;border-radius:8px;border:2px solid var(--ac);background:#16202e;color:var(--fg);width:150px"><button style="min-width:0;padding:10px 18px;font-size:16px" onclick="redeem()">Beváltás</button></div><p id="cm" class="s"></p><button onclick="menu()">Vissza</button>`,1);
 $('vm').oninput=e=>{vol.m=+e.target.value;av()};$('tt').onchange=e=>{tut=e.target.checked;try{localStorage.setItem('ad_tut',tut?1:0)}catch(x){}};$('vs').oninput=e=>{vol.s=+e.target.value;av();ia();sfx('jump')}}
function newGame(){deaths=0;start(tut?0:1)}
function start(i){ia();if(A.state=='suspended')A.resume();lbReg();load(i);hide();state='play';playM(i)}
let last=0,acc=0;
function loop(t){requestAnimationFrame(loop);const dt=Math.min((t-last)/1000,.05);last=t;if(state=='play'){acc+=dt;PT+=dt;while(acc>=1/120){step(1/120);acc-=1/120;if(state!='play')break}}draw()}
load(0);menu();requestAnimationFrame(loop);lbInit();
</script></body></html>
